<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — द रसोई ऑन व्हील्स</title><link rel="stylesheet" href="styles.css"></head><body><div class="site-shell"><div id="siteHeader"></div><main class="page-wrap"><div class="page-title"><span class="section-kicker">CHECKOUT</span><h1>Almost there.</h1><p>Choose where and how you want to collect your order.</p></div><div class="checkout-layout"><section class="panel"><div class="steps"><span class="active">1</span><i></i><span class="active">2</span><i></i><span class="active">3</span></div><form id="checkoutForm" class="form-grid"><label>Your name<input id="customerName" required placeholder="e.g. Rohan"></label><label>Pickup point<select id="pickupPoint"><option>Night Canteen Counter</option><option>Hostel Block</option><option>Campus Main Gate</option></select></label><label>Payment<select id="paymentMethod"><option>Pay at counter - Cash</option><option>Pay at counter - UPI</option></select></label><div class="checkout-total-box"><span>You'll pay</span><strong id="checkoutTotal">₹0</strong></div><button class="btn btn-primary" id="placeOrderBtn" type="submit" style="width:100%">Place order →</button></form></section><aside class="panel"><span class="section-kicker">ORDER SUMMARY</span><h2>Your items</h2><div id="checkoutSummary"></div><div class="summary-note">This is an exhibition prototype. No real payment is processed.</div></aside></div></main><footer><div><strong>द रसोई ऑन व्हील्स</strong><span>What We Eat, We Serve!</span></div><p>After placing the order, open Recent Orders to watch the live tracker.</p></footer></div><div class="toast" id="toast"></div><script src="app.js"></script></body></html>
